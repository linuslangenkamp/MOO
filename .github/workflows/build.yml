name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        generator: ["Unix Makefiles", "Ninja"]
        compiler-pair:
          - { c: "gcc", cxx: "g++" , fortran: "gfortran"}
          - { c: "clang", cxx: "clang++" , fortran: "gfortran"} # flang-20 isnt available on 'Jammy'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Install METIS, LAPACK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get -qqy install libmetis-dev liblapack-dev gfortran

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_C_COMPILER=${{ matrix.compiler-pair.c }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler-pair.cxx }} \
            -DCMAKE_Fortran_COMPILER=${{ matrix.compiler-pair.fortran }} \
            -DMETIS_LIB_PATH=/usr/lib/x86_64-linux-gnu/libmetis.so.5.1.0 \
            -DMETIS_INC_PATH=/usr/include \
            -DMOO_WITH_GDOPT_EXAMPLE=ON \
            -G "${{ matrix.generator }}"

      - name: Build
        run: cmake --build build --target install -- -j$(nproc)

      - name: Run test
        run: ./build/gdopt

      - uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.os }}-${{ matrix.generator }}-${{ matrix.compiler-pair.c }}
          path: install/
