name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        generator: ["Unix Makefiles", "Ninja"]
        compiler-pair:
          - { c: "gcc",   cxx: "g++",     fortran: "gfortran" }
          - { c: "clang", cxx: "clang++", fortran: "gfortran" }

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get -qqy install libmetis-dev liblapack-dev gfortran

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_C_COMPILER=${{ matrix.compiler-pair.c }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler-pair.cxx }} \
            -DCMAKE_Fortran_COMPILER=${{ matrix.compiler-pair.fortran }} \
            -DMOO_WITH_GDOPT_EXAMPLE=ON \
            -G "${{ matrix.generator }}"

      - name: Build
        run: cmake --build build --target install -- -j$(nproc)

      - name: Run test
        run: ./build/gdopt

      - uses: actions/upload-artifact@v4
        with:
          name: install-linux-${{ matrix.generator }}-${{ matrix.compiler-pair.c }}
          path: install/

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        generator: ["MSYS Makefiles", "Ninja"]
        compiler-pair:
          - { c: "gcc",   cxx: "g++",     fortran: "gfortran" }
          - { c: "clang", cxx: "clang++", fortran: "gfortran" }

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: |
            mingw-w64-ucrt-x86_64-metis
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            make

      - name: Configure
        shell: msys2 {0}
        run: |
          export PATH="/ucrt64/bin:$PATH"
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_C_COMPILER=${{ matrix.compiler-pair.c }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler-pair.cxx }} \
            -DCMAKE_Fortran_COMPILER=${{ matrix.compiler-pair.fortran }} \
            -DMOO_WITH_GDOPT_EXAMPLE=ON \
            -G "${{ matrix.generator }}"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --target install -- -j$(nproc)

      - name: Run test
        shell: msys2 {0}
        run: ./build/gdopt

      - uses: actions/upload-artifact@v4
        with:
          name: install-windows-${{ matrix.generator }}-${{ matrix.compiler-pair.c }}
          path: install/

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        generator: ["Unix Makefiles", "Ninja"]
        compiler-pair:
          - { c: "clang", cxx: "clang++", fortran: "gfortran" }

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew update
          brew install metis

      - name: Debug gfortran
        run: |
          echo "Current PATH: $PATH"
          which gfortran-15 || echo "gfortran not found in PATH"
          echo "All gfortran binaries found on disk:"
          sudo find /usr /opt/homebrew -type f -name "gfortran*" 2>/dev/null

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_C_COMPILER=${{ matrix.compiler-pair.c }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler-pair.cxx }} \
            -DCMAKE_Fortran_COMPILER=${{ matrix.compiler-pair.fortran }} \
            -DMOO_WITH_GDOPT_EXAMPLE=ON \
            -G "${{ matrix.generator }}"

      - name: Build
        run: cmake --build build --target install -- -j$(sysctl -n hw.logicalcpu)

      - name: Run test
        run: ./build/gdopt

      - uses: actions/upload-artifact@v4
        with:
          name: install-macos-${{ matrix.compiler-pair.c }}
          path: install/
